; ═══ PHP UPLOAD LİMİTLERİ (PHP-FPM için) ═══
; Bu dosya cPanel PHP-FPM sunucularında .htaccess php_value direktifleri
; çalışmadığında devreye girer. 512MB'a kadar dosya yüklenmesine izin verir.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 50
