<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR HASAR DANIŞMANLIK - MÜŞTERİ PORTALI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Manrope',system-ui,sans-serif; background:#f0f4f8; color:#1e293b; min-height:100vh; }
  .portal-header { background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%); color:#fff; padding:20px 0; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  .portal-header .inner { max-width:900px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; }
  .portal-header h1 { font-size:18px; font-weight:800; letter-spacing:.5px; }
  .portal-header .sub { font-size:11px; opacity:.8; margin-top:2px; }
  .portal-header .user-info { text-align:right; font-size:12px; }
  .portal-header .user-info .name { font-weight:700; font-size:14px; }
  .portal-header .logout-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; padding:6px 14px; border-radius:6px; font-size:11px; cursor:pointer; font-weight:600; margin-top:6px; }
  .portal-header .logout-btn:hover { background:rgba(255,255,255,.25); }
  .container { max-width:900px; margin:0 auto; padding:20px; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; overflow:hidden; border:1px solid #e2e8f0; }
  .card-head { padding:14px 20px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:10px; background:rgba(37,99,235,.03); }
  .card-head .icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .card-head h2 { font-size:14px; font-weight:700; }
  .card-head .desc { font-size:11px; color:#64748b; }
  .card-body { padding:20px; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:16px; text-align:center; }
  .stat-card .label { font-size:10px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.5px; }
  .stat-card .value { font-size:20px; font-weight:800; margin-top:4px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:10px; font-weight:700; }
  .badge-blue { background:#dbeafe; color:#2563eb; border:1px solid #bfdbfe; }
  .badge-green { background:#dcfce7; color:#16a34a; border:1px solid #bbf7d0; }
  .badge-amber { background:#fef3c7; color:#ca8a04; border:1px solid #fde68a; }
  .badge-red { background:#fee2e2; color:#dc2626; border:1px solid #fecaca; }
  .info-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .info-row:last-child { border-bottom:none; }
  .info-row .lbl { color:#64748b; font-weight:500; }
  .info-row .val { font-weight:600; text-align:right; }
  .evrak-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#f8fafc; border-radius:8px; margin-bottom:8px; border:1px solid #e2e8f0; }
  .evrak-item .name { font-size:13px; font-weight:600; }
  .evrak-item .meta { font-size:10px; color:#64748b; margin-top:2px; }
  .evrak-item .btn-dl { background:#2563eb; color:#fff; padding:6px 14px; border-radius:6px; font-size:11px; cursor:pointer; border:none; font-weight:600; text-decoration:none; }
  .evrak-item .btn-dl:hover { background:#1d4ed8; }
  .timeline { position:relative; padding-left:24px; }
  .timeline::before { content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:#e2e8f0; }
  .timeline-item { position:relative; margin-bottom:16px; }
  .timeline-item::before { content:''; position:absolute; left:-20px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--dot-color, #2563eb); border:2px solid #fff; box-shadow:0 0 0 2px var(--dot-color, #2563eb); }
  .timeline-item .date { font-size:10px; color:#94a3b8; font-weight:500; }
  .timeline-item .text { font-size:13px; font-weight:500; margin-top:2px; }
  .msg-list { max-height:400px; overflow-y:auto; margin-bottom:12px; }
  .msg-item { margin-bottom:8px; max-width:80%; }
  .msg-item.musteri { margin-left:auto; }
  .msg-item .bubble { padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5; }
  .msg-item.firma .bubble { background:#f1f5f9; border:1px solid #e2e8f0; border-bottom-left-radius:2px; }
  .msg-item.musteri .bubble { background:#2563eb; color:#fff; border-bottom-right-radius:2px; }
  .msg-item .time { font-size:10px; color:#94a3b8; margin-top:2px; }
  .msg-item.musteri .time { text-align:right; }
  .msg-input { display:flex; gap:8px; }
  .msg-input input { flex:1; padding:10px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; outline:none; font-family:inherit; }
  .msg-input input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
  .msg-input button { background:#2563eb; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .msg-input button:hover { background:#1d4ed8; }
  .msg-input button:disabled { opacity:.5; cursor:not-allowed; }
  /* LOGIN */
  .login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1e40af 100%); padding:20px; }
  .login-box { background:#fff; border-radius:16px; padding:40px 32px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .login-box .logo { text-align:center; margin-bottom:24px; }
  .login-box .logo h1 { font-size:20px; font-weight:800; color:#1e3a5f; }
  .login-box .logo .sub { font-size:12px; color:#64748b; margin-top:4px; }
  .login-box .title { font-size:15px; font-weight:700; text-align:center; margin-bottom:20px; color:#334155; }
  .login-box label { display:block; font-size:11px; font-weight:600; color:#475569; margin-bottom:6px; letter-spacing:.5px; }
  .login-box input { width:100%; padding:12px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; outline:none; margin-bottom:16px; font-family:inherit; }
  .login-box input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
  .login-box .btn-primary { width:100%; background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border:none; padding:14px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:.3px; }
  .login-box .btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(37,99,235,.4); }
  .login-box .btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .login-box .error { background:#fee2e2; color:#dc2626; padding:10px 14px; border-radius:8px; font-size:12px; font-weight:500; margin-bottom:12px; border:1px solid #fecaca; }
  .login-box .info { background:#dbeafe; color:#1e40af; padding:10px 14px; border-radius:8px; font-size:12px; font-weight:500; margin-bottom:12px; border:1px solid #bfdbfe; }
  .login-box .step-info { text-align:center; font-size:11px; color:#94a3b8; margin-top:12px; }
  .kvkk-notice { text-align:center; font-size:10px; color:#94a3b8; margin-top:16px; line-height:1.5; }
  .tabs { display:flex; border-bottom:1px solid #e2e8f0; margin-bottom:0; }
  .tab { padding:12px 20px; cursor:pointer; font-size:12px; font-weight:600; color:#64748b; border-bottom:2px solid transparent; transition:all .2s; }
  .tab.active { color:#2563eb; border-bottom-color:#2563eb; }
  .tab:hover { color:#2563eb; }
  .footer { text-align:center; padding:24px 20px; font-size:11px; color:#94a3b8; border-top:1px solid #e2e8f0; margin-top:20px; }
  @media(max-width:600px) {
    .stat-grid { grid-template-columns:1fr 1fr; }
    .portal-header .inner { flex-direction:column; text-align:center; gap:12px; }
    .portal-header .user-info { text-align:center; }
    .msg-item { max-width:90%; }
  }
</style>
</head>
<body>
<div id="portal-root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState, useEffect, useCallback, useRef} = React;

/* ═══ PORTAL API ═══ */
const API = '/api/v1';
const portalApi = {
  token: null,
  setToken(t) { this.token = t; if(t) sessionStorage.setItem('portal_token',t); else sessionStorage.removeItem('portal_token'); },
  getToken() { if(!this.token) this.token = sessionStorage.getItem('portal_token'); return this.token; },
  async req(ep, o={}) {
    const h = {'Content-Type':'application/json'};
    const t = this.getToken();
    if(t) h['Authorization'] = 'Portal ' + t;
    try {
      const r = await fetch(API+ep, {...o, headers:{...h,...o.headers}});
      if(r.status===401) { this.setToken(null); return {success:false, error:'OTURUM SÜRESİ DOLMUŞ'}; }
      const txt = await r.text();
      try { return JSON.parse(txt); } catch(e) { return {success:false, error:'SUNUCU HATASI'}; }
    } catch(e) { return {success:false, error:'BAĞLANTI HATASI'}; }
  },
  tcGiris(tc_kimlik,telefon) { return this.req('/portal/tc-giris.php',{method:'POST',body:JSON.stringify({tc_kimlik,telefon})}); },
  otpGonder(telefon) { return this.req('/portal/otp-gonder.php',{method:'POST',body:JSON.stringify({telefon})}); },
  otpDogrula(telefon,otp) { return this.req('/portal/otp-dogrula.php',{method:'POST',body:JSON.stringify({telefon,otp})}); },
  linkGiris(kod) { return this.req('/portal/link-giris.php',{method:'POST',body:JSON.stringify({erisim_kodu:kod})}); },
  dosya() { return this.req('/portal/dosya.php'); },
  mesajlar() { return this.req('/portal/mesajlar.php'); },
  mesajGonder(mesaj) { return this.req('/portal/mesajlar.php',{method:'POST',body:JSON.stringify({mesaj})}); },
  evrakUrl(id) { return API+'/portal/evrak-indir.php?id='+id+'&mode=inline'; },
  evrakDownUrl(id) { return API+'/portal/evrak-indir.php?id='+id; }
};

/* ═══ LOGIN SAYFASI ═══ */
const LoginPage = ({onLogin}) => {
  const [tcKimlik, setTcKimlik] = useState('');
  const [telefon, setTelefon] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [linkLoading, setLinkLoading] = useState(false);

  // Link ile giriş kontrolü (URL'de #kod=xxx varsa)
  useEffect(() => {
    const hash = window.location.hash;
    if(hash && hash.includes('kod=')) {
      const kod = hash.split('kod=')[1];
      if(kod) {
        setLinkLoading(true);
        portalApi.linkGiris(kod).then(r => {
          setLinkLoading(false);
          if(r?.success) {
            portalApi.setToken(r.data.token);
            onLogin(r.data.erisim);
          } else {
            setError(r?.error || 'GEÇERSİZ ERİŞİM LİNKİ');
          }
        });
      }
    }
  }, []);

  const girisYap = async () => {
    if(!tcKimlik || tcKimlik.length !== 11) { setError('GEÇERLİ BİR TC KİMLİK NUMARASI GİRİN (11 HANELİ)'); return; }
    if(!telefon || telefon.length < 10) { setError('GEÇERLİ BİR TELEFON NUMARASI GİRİN'); return; }
    setLoading(true); setError('');
    const r = await portalApi.tcGiris(tcKimlik, telefon);
    setLoading(false);
    if(r?.success) {
      portalApi.setToken(r.data.token);
      onLogin(r.data.erisim);
    } else {
      setError(r?.error || 'GİRİŞ BAŞARISIZ');
    }
  };

  if(linkLoading) return (
    <div className="login-page">
      <div className="login-box" style={{textAlign:'center'}}>
        <div className="logo">
          <h1>MR HASAR DANIŞMANLIK</h1>
          <div className="sub">MÜŞTERİ / MAĞDUR PORTALI</div>
        </div>
        <div style={{padding:30, color:'#64748b', fontSize:14}}>PORTAL ERİŞİMİ DOĞRULANIYOR...</div>
      </div>
    </div>
  );

  return (
    <div className="login-page">
      <div className="login-box">
        <div className="logo">
          <h1>MR HASAR DANIŞMANLIK</h1>
          <div className="sub">MÜŞTERİ / MAĞDUR PORTALI</div>
        </div>

        <div className="title">PORTALA GİRİŞ YAP</div>

        {error && <div className="error">{error}</div>}

        <label>TC KİMLİK NUMARANIZ</label>
        <input
          type="text"
          placeholder="TC KİMLİK NO (11 HANELİ)"
          value={tcKimlik}
          onChange={e => setTcKimlik(e.target.value.replace(/[^0-9]/g,''))}
          maxLength={11}
          autoFocus
          style={{letterSpacing:1}}
        />

        <label>TELEFON NUMARANIZ</label>
        <input
          type="tel"
          placeholder="05XX XXX XX XX"
          value={telefon}
          onChange={e => setTelefon(e.target.value.replace(/[^0-9]/g,''))}
          maxLength={11}
          onKeyDown={e => e.key === 'Enter' && girisYap()}
        />

        <button className="btn-primary" onClick={girisYap} disabled={loading}>
          {loading ? 'GİRİŞ YAPILIYOR...' : 'GİRİŞ YAP'}
        </button>

        <div className="step-info">
          DOSYANIZA KAYITLI TC KİMLİK VE TELEFON NUMARANIZ<br/>
          İLE GİRİŞ YAPABİLİRSİNİZ.
        </div>

        <div className="kvkk-notice">
          Bu portala giriş yaparak 6698 sayılı KVKK kapsamında<br/>
          kişisel verilerinizin işlenmesini kabul etmiş olursunuz.
        </div>
      </div>
    </div>
  );
};

/* ═══ DOSYA DURUM BADGE ═══ */
const AsamaBadge = ({asama}) => {
  if(!asama) return null;
  const s = asama.toUpperCase();
  let cls = 'badge-blue';
  if(s.includes('KAPAN') || s.includes('TAHSİL') || s.includes('TAMAMLAN')) cls = 'badge-green';
  else if(s.includes('BEKLİYOR') || s.includes('DEĞERLEND')) cls = 'badge-amber';
  else if(s.includes('İPTAL') || s.includes('RED')) cls = 'badge-red';
  return <span className={`badge ${cls}`}>{asama}</span>;
};

/* ═══ PORTAL DASHBOARD ═══ */
const Dashboard = ({erisim}) => {
  const [tab, setTab] = useState('ozet');
  const [data, setData] = useState(null);
  const [mesajlar, setMesajlar] = useState([]);
  const [yeniMesaj, setYeniMesaj] = useState('');
  const [loading, setLoading] = useState(true);
  const [sending, setSending] = useState(false);
  const mesajRef = useRef(null);

  const loadData = useCallback(async () => {
    setLoading(true);
    const r = await portalApi.dosya();
    if(r?.success) setData(r.data);
    setLoading(false);
  }, []);

  const loadMesajlar = useCallback(async () => {
    const r = await portalApi.mesajlar();
    if(r?.success) setMesajlar(r.data || []);
  }, []);

  useEffect(() => { loadData(); loadMesajlar(); }, []);

  // Mesaj auto-scroll
  useEffect(() => {
    if(mesajRef.current) mesajRef.current.scrollTop = mesajRef.current.scrollHeight;
  }, [mesajlar, tab]);

  // Mesaj polling (30 saniye)
  useEffect(() => {
    const iv = setInterval(loadMesajlar, 30000);
    return () => clearInterval(iv);
  }, []);

  const gonderMesaj = async () => {
    if(!yeniMesaj.trim()) return;
    setSending(true);
    const r = await portalApi.mesajGonder(yeniMesaj);
    setSending(false);
    if(r?.success) {
      setYeniMesaj('');
      loadMesajlar();
    }
  };

  const cikis = () => {
    portalApi.setToken(null);
    sessionStorage.clear();
    // URL'deki #kod=xxx hash'ini temizle ki tekrar otomatik giriş yapmasın
    if(window.location.hash) {
      window.location.hash = '';
      history.replaceState(null, '', window.location.pathname);
    }
    window.location.reload();
  };

  const formatTarih = (t) => {
    if(!t) return '-';
    try { const d = new Date(t); return d.toLocaleDateString('tr-TR'); } catch(e) { return t; }
  };
  const formatTarihSaat = (t) => {
    if(!t) return '-';
    try { const d = new Date(t); return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); } catch(e) { return t; }
  };

  if(loading) return (
    <>
      <header className="portal-header">
        <div className="inner">
          <div><h1>MR HASAR DANIŞMANLIK</h1><div className="sub">MÜŞTERİ PORTALI</div></div>
        </div>
      </header>
      <div className="container" style={{textAlign:'center', padding:60}}>
        <div style={{fontSize:14, color:'#64748b'}}>YÜKLENİYOR...</div>
      </div>
    </>
  );

  const dosya = data?.dosya;
  const magdur = data?.magdur;
  const evraklar = data?.evraklar || [];
  const surecler = data?.surecler || [];
  const firma = data?.firma || {};
  const evrakIndirIzin = data?.evrak_indir_izin === '1' || data?.evrak_indir_izin === 1 || data?.evrak_indir_izin === true || data?.evrak_indir_izin === 'true' || data?.evrak_indir_izin === 'evet';

  const TABS = [
    {key:'ozet', label:'DOSYA ÖZETİ', icon:'📋'},
    {key:'evrak', label:'EVRAKLAR', icon:'📄', count: evraklar.length},
    {key:'mesaj', label:'MESAJLAR', icon:'💬', count: data?.okunmamis_mesaj || 0},
    {key:'surecler', label:'AŞAMALAR / DOSYA SÜREÇLERİ', icon:'📅'}
  ];

  return (
    <>
      <header className="portal-header">
        <div className="inner">
          <div>
            <h1>{firma.firma_adi || 'MR HASAR DANIŞMANLIK'}</h1>
            <div className="sub">MÜŞTERİ PORTALI</div>
          </div>
          <div className="user-info">
            <div className="name">{erisim.ad_soyad}</div>
            <div style={{fontSize:11, opacity:.8}}>DOSYA: {erisim.dosya_no}</div>
            <button className="logout-btn" onClick={cikis}>ÇIKIŞ YAP</button>
          </div>
        </div>
      </header>

      <div className="container">
        {/* KARŞILAMA */}
        {firma.portal_karsilama && (
          <div className="card" style={{marginBottom:16}}>
            <div className="card-body" style={{fontSize:13, color:'#475569', lineHeight:1.6}}>
              {firma.portal_karsilama}
            </div>
          </div>
        )}

        {/* STAT CARDS */}
        <div className="stat-grid">
          <div className="stat-card">
            <div className="label">DOSYA NO</div>
            <div className="value" style={{color:'#2563eb', fontSize:16}}>{dosya?.dosya_no}</div>
          </div>
          <div className="stat-card">
            <div className="label">DOSYA TÜRÜ</div>
            <div className="value" style={{fontSize:16}}>{dosya?.dosya_turu === 'ADK' ? 'ARAÇ DEĞER KAYBI' : dosya?.dosya_turu === 'BH' ? 'BEDENİ HASAR' : dosya?.dosya_turu}</div>
          </div>
          <div className="stat-card">
            <div className="label">GÜNCEL DURUM</div>
            <div style={{marginTop:6}}><AsamaBadge asama={dosya?.asama}/></div>
          </div>
          <div className="stat-card">
            <div className="label">SİGORTA ŞİRKETİ</div>
            <div className="value" style={{fontSize:14}}>{dosya?.sigorta_sirket || '-'}</div>
          </div>
        </div>

        {/* TAB MENU */}
        <div className="card">
          <div className="tabs" style={{padding:'0 16px'}}>
            {TABS.map(t => (
              <div key={t.key} className={`tab ${tab===t.key?'active':''}`} onClick={() => { setTab(t.key); if(t.key==='mesaj') loadMesajlar(); }}>
                <span style={{marginRight:6}}>{t.icon}</span>
                {t.label}
                {t.count > 0 && <span style={{background:'#ef4444', color:'#fff', fontSize:9, fontWeight:700, padding:'2px 6px', borderRadius:10, marginLeft:6}}>{t.count}</span>}
              </div>
            ))}
          </div>

          <div className="card-body">
            {/* DOSYA ÖZETİ */}
            {tab === 'ozet' && (
              <div>
                <h3 style={{fontSize:13, fontWeight:700, marginBottom:12, color:'#334155'}}>DOSYA BİLGİLERİ</h3>
                <div className="info-row"><span className="lbl">DOSYA NO</span><span className="val">{dosya?.dosya_no}</span></div>
                <div className="info-row"><span className="lbl">DOSYA TÜRÜ</span><span className="val">{dosya?.dosya_turu}</span></div>
                <div className="info-row"><span className="lbl">TALEP TÜRÜ</span><span className="val">{dosya?.talep_turu || '-'}</span></div>
                <div className="info-row"><span className="lbl">DURUM</span><span className="val"><AsamaBadge asama={dosya?.asama}/></span></div>
                <div className="info-row"><span className="lbl">SİGORTA ŞİRKETİ</span><span className="val">{dosya?.sigorta_sirket || '-'}</span></div>
                <div className="info-row"><span className="lbl">KAZA TARİHİ</span><span className="val">{formatTarih(dosya?.kaza_tarihi)}</span></div>
                <div className="info-row"><span className="lbl">KAZA İLİ</span><span className="val">{dosya?.kaza_il || '-'}</span></div>
                <div className="info-row"><span className="lbl">DOSYA AÇILIŞ TARİHİ</span><span className="val">{formatTarih(dosya?.acilis_tarihi)}</span></div>

                {magdur && (
                  <>
                    <h3 style={{fontSize:13, fontWeight:700, marginTop:20, marginBottom:12, color:'#334155'}}>MÜŞTERİ BİLGİLERİ</h3>
                    <div className="info-row"><span className="lbl">AD SOYAD</span><span className="val">{magdur.ad_soyad}</span></div>
                    <div className="info-row"><span className="lbl">İL / İLÇE</span><span className="val">{[magdur.il, magdur.ilce].filter(Boolean).join(' / ') || '-'}</span></div>
                  </>
                )}

                {/* FİRMA İLETİŞİM */}
                <h3 style={{fontSize:13, fontWeight:700, marginTop:20, marginBottom:12, color:'#334155'}}>FİRMA İLETİŞİM</h3>
                {firma.firma_telefon && <div className="info-row"><span className="lbl">TELEFON</span><span className="val">{firma.firma_telefon}</span></div>}
                {firma.firma_email && <div className="info-row"><span className="lbl">E-POSTA</span><span className="val">{firma.firma_email}</span></div>}
                {firma.firma_adres && <div className="info-row"><span className="lbl">ADRES</span><span className="val" style={{maxWidth:'60%', fontSize:12}}>{firma.firma_adres}</span></div>}
              </div>
            )}

            {/* EVRAKLAR */}
            {tab === 'evrak' && (
              <div>
                {evraklar.length === 0 ? (
                  <div style={{textAlign:'center', padding:40, color:'#94a3b8', fontSize:13}}>
                    HENÜZ EVRAK YÜKLENMEMİŞ
                  </div>
                ) : (
                  <>
                    <div style={{fontSize:11, color:'#64748b', marginBottom:12, fontWeight:500}}>
                      DOSYANIZA YÜKLENEN EVRAKLAR ({evraklar.length} ADET)
                    </div>
                    {evraklar.map(e => (
                      <div key={e.id} className="evrak-item">
                        <div style={{flex:1}}>
                          <div className="name">{e.evrak_turu || e.dosya_adi}</div>
                          <div className="meta">{e.dosya_adi} - {formatTarihSaat(e.created_at)}</div>
                        </div>
                        {evrakIndirIzin && (
                          <button className="btn-dl" onClick={() => {
                            const h = {}; if(portalApi.getToken()) h['Authorization'] = 'Portal ' + portalApi.getToken();
                            fetch(portalApi.evrakDownUrl(e.id), {headers:h}).then(r => {
                              if(!r.ok) { alert('İNDİRME YETKİSİ KAPATILMIŞ'); return; }
                              return r.blob();
                            }).then(b => {
                              if(!b) return;
                              const url = URL.createObjectURL(b);
                              const link = document.createElement('a');
                              link.href = url; link.download = e.dosya_adi; link.click();
                              URL.revokeObjectURL(url);
                            }).catch(() => alert('İNDİRME HATASI'));
                          }}>
                            İNDİR
                          </button>
                        )}
                      </div>
                    ))}
                  </>
                )}
              </div>
            )}

            {/* MESAJLAR */}
            {tab === 'mesaj' && (
              <div>
                <div className="msg-list" ref={mesajRef}>
                  {mesajlar.length === 0 ? (
                    <div style={{textAlign:'center', padding:40, color:'#94a3b8', fontSize:13}}>
                      HENÜZ MESAJ YOK. FİRMAYA MESAJ GÖNDEREBİLİRSİNİZ.
                    </div>
                  ) : (
                    mesajlar.map(m => (
                      <div key={m.id} className={`msg-item ${m.gonderen_tip}`}>
                        <div className="bubble">
                          <div style={{fontSize:10, fontWeight:600, marginBottom:2, opacity:.7}}>
                            {m.gonderen_tip === 'firma' ? (m.gonderen_adi || 'FİRMA') : 'SİZ'}
                          </div>
                          {m.mesaj}
                        </div>
                        <div className="time">{formatTarihSaat(m.created_at)}</div>
                      </div>
                    ))
                  )}
                </div>
                <div className="msg-input">
                  <input
                    value={yeniMesaj}
                    onChange={e => setYeniMesaj(e.target.value)}
                    placeholder="Mesajınızı yazın..."
                    maxLength={2000}
                    onKeyDown={e => e.key === 'Enter' && !sending && gonderMesaj()}
                  />
                  <button onClick={gonderMesaj} disabled={sending || !yeniMesaj.trim()}>
                    {sending ? '...' : 'GÖNDER'}
                  </button>
                </div>
              </div>
            )}

            {/* AŞAMALAR / DOSYA SÜREÇLERİ */}
            {tab === 'surecler' && (
              <div>
                {surecler.length === 0 ? (
                  <div style={{textAlign:'center', padding:40, color:'#94a3b8', fontSize:13}}>
                    DOSYA SÜRECİ BULUNAMADI
                  </div>
                ) : (
                  <div className="timeline">
                    {surecler.map((s, i) => {
                      const tipRenk = s.islem_tipi === 'asama_degisikligi' ? '#2563eb' : s.islem_tipi === 'sistem' ? '#16a34a' : '#64748b';
                      return (
                        <div key={i} className="timeline-item" style={{'--dot-color': tipRenk}}>
                          <div className="date">{formatTarihSaat(s.created_at)}</div>
                          <div className="text" style={{fontWeight:600}}>{s.baslik}</div>
                          {s.detay && <div style={{fontSize:11, color:'#64748b', marginTop:2}}>{s.detay}</div>}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>

        <div className="footer">
          <div style={{marginBottom:8, fontSize:13, fontWeight:600, color:'#475569'}}>
            {firma.firma_adi || 'MR HASAR DANIŞMANLIK'}
          </div>
          <div style={{marginBottom:8, fontSize:12, color:'#64748b'}}>
            İLETİŞİM: <a href="tel:03625026502" style={{color:'#2563eb', textDecoration:'none'}}>0362 502 65 02</a> - <a href="tel:05550984254" style={{color:'#2563eb', textDecoration:'none'}}>0555 098 42 54</a>
          </div>
          <div style={{marginBottom:6, fontSize:10, color:'#94a3b8'}}>
            6698 SAYILI KVK KANUNU KAPSAMINDA KİŞİSEL VERİLERİNİZ KORUNMAKTADIR.
          </div>
          <div style={{fontSize:10, color:'#94a3b8'}}>
            {firma.firma_adi || 'MR HASAR DANIŞMANLIK'} &copy; {new Date().getFullYear()}
          </div>
        </div>
      </div>
    </>
  );
};

/* ═══ ANA UYGULAMA ═══ */
const PortalApp = () => {
  const [erisim, setErisim] = useState(null);

  // Mevcut oturumu kontrol et
  useEffect(() => {
    const token = sessionStorage.getItem('portal_token');
    if(token) {
      portalApi.setToken(token);
      portalApi.dosya().then(r => {
        if(r?.success) {
          // Token geçerli, dashboard'a yönlendir
          const d = r.data?.dosya;
          setErisim({
            dosya_no: d?.dosya_no,
            dosya_turu: d?.dosya_turu,
            asama: d?.asama,
            ad_soyad: r.data?.magdur?.ad_soyad || ''
          });
        } else {
          portalApi.setToken(null);
        }
      });
    }
  }, []);

  if(!erisim) return <LoginPage onLogin={setErisim}/>;
  return <Dashboard erisim={erisim}/>;
};

ReactDOM.createRoot(document.getElementById('portal-root')).render(<PortalApp/>);
</script>
</body>
</html>
