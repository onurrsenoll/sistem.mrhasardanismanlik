<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NETSIPP - GELEN ÇAĞRI</title>
<style>
  body { font-family: Arial, sans-serif; background: #0B1120; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #111827; border: 1px solid #1F2937; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; text-align: center; }
  .icon { width: 64px; height: 64px; background: rgba(16,185,129,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; animation: ring 1.5s infinite; }
  .icon svg { width: 32px; height: 32px; fill: none; stroke: #10b981; stroke-width: 2; }
  h2 { margin: 0 0 8px; font-size: 18px; text-transform: uppercase; }
  .num { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin: 12px 0; color: #10b981; }
  .name { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
  .info { font-size: 11px; color: #64748b; }
  @keyframes ring { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)} 50%{box-shadow:0 0 0 16px rgba(16,185,129,0)} }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
  </div>
  <h2>GELEN ÇAĞRI</h2>
  <div class="num" id="arayan">...</div>
  <div class="name" id="arayanAdi"></div>
  <div class="info" id="tarih"></div>
</div>
<script>
  // URL parametrelerini al
  const params = new URLSearchParams(window.location.search);
  const arayan = params.get('arayan') || '';
  const arayanAdi = params.get('arayanadi') || '';
  const aramaTarihi = params.get('aramatarihi') || new Date().toLocaleString('tr-TR');
  const aramaId = params.get('aramaid') || '';
  const senaryo = params.get('senaryo') || '';

  document.getElementById('arayan').textContent = arayan || 'BİLİNMEYEN NUMARA';
  document.getElementById('arayanAdi').textContent = arayanAdi || '';
  document.getElementById('tarih').textContent = aramaTarihi;

  // localStorage'a yaz - ana uygulama bunu dinleyecek
  const callData = { arayan, arayanAdi, aramaTarihi, aramaId, senaryo, timestamp: Date.now() };
  localStorage.setItem('mr_netsipp_gelen', JSON.stringify(callData));

  // API'ye de bildir
  fetch('/api/v1/netsipp/gelen-cagri.php?arayan=' + encodeURIComponent(arayan) +
    '&arayanadi=' + encodeURIComponent(arayanAdi) +
    '&aramatarihi=' + encodeURIComponent(aramaTarihi) +
    '&aramaid=' + encodeURIComponent(aramaId) +
    '&senaryo=' + encodeURIComponent(senaryo))
    .then(r => r.json())
    .then(data => {
      if (data?.data?.crm_kayit) {
        document.getElementById('arayanAdi').textContent =
          (data.data.crm_kayit.ad_soyad || arayanAdi) + ' (CRM KAYITLI)';
      }
    })
    .catch(() => {});

  // 10 saniye sonra otomatik kapat (opsiyonel)
  // setTimeout(() => window.close(), 10000);
</script>
</body>
</html>
