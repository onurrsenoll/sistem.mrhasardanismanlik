<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NETSIPP - ÇAĞRI BİLDİRİMİ</title>
<style>
  body { font-family: Arial, sans-serif; background: #0B1120; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #111827; border: 1px solid #1F2937; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; text-align: center; }
  .icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .icon-gelen { background: rgba(16,185,129,0.2); animation: ring 1.5s infinite; }
  .icon-giden { background: rgba(37,99,235,0.2); animation: ring 1.5s infinite; }
  .icon svg { width: 32px; height: 32px; fill: none; stroke-width: 2; }
  .icon-gelen svg { stroke: #10b981; }
  .icon-giden svg { stroke: #2563eb; }
  h2 { margin: 0 0 8px; font-size: 18px; text-transform: uppercase; }
  .num { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin: 12px 0; }
  .num-gelen { color: #10b981; }
  .num-giden { color: #2563eb; }
  .name { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
  .info { font-size: 11px; color: #64748b; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20; font-size: 11px; font-weight: 700; margin-bottom: 12px; }
  .badge-gelen { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
  .badge-giden { background: rgba(37,99,235,0.15); color: #2563eb; border: 1px solid rgba(37,99,235,0.3); }
  @keyframes ring { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)} 50%{box-shadow:0 0 0 16px rgba(16,185,129,0)} }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="iconDiv">
    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
  </div>
  <div id="badge"></div>
  <h2 id="baslik">ÇAĞRI</h2>
  <div class="num" id="arayan">...</div>
  <div class="name" id="arayanAdi"></div>
  <div class="info" id="tarih"></div>
</div>
<script>
  // URL PARAMETRELERİNİ AL
  const params = new URLSearchParams(window.location.search);
  const arayan = params.get('arayan') || '';
  const arayanAdi = params.get('arayanadi') || '';
  const aranan = params.get('aranan') || '';
  const aramaTarihi = params.get('aramatarihi') || new Date().toLocaleString('tr-TR');
  const aramaId = params.get('aramaid') || '';
  const senaryo = params.get('senaryo') || '';
  const yon = params.get('yon') || 'gelen';

  // YÖN'E GÖRE GÖRSEL AYARLA
  const isGiden = yon === 'giden';
  const iconDiv = document.getElementById('iconDiv');
  const numEl = document.getElementById('arayan');
  const badge = document.getElementById('badge');

  iconDiv.className = 'icon ' + (isGiden ? 'icon-giden' : 'icon-gelen');
  document.getElementById('baslik').textContent = isGiden ? 'GİDEN ÇAĞRI' : 'GELEN ÇAĞRI';
  document.title = isGiden ? 'NETSIPP - GİDEN ÇAĞRI' : 'NETSIPP - GELEN ÇAĞRI';

  badge.className = 'badge ' + (isGiden ? 'badge-giden' : 'badge-gelen');
  badge.textContent = isGiden ? 'GİDEN' : 'GELEN';

  numEl.className = 'num ' + (isGiden ? 'num-giden' : 'num-gelen');
  numEl.textContent = arayan || 'BİLİNMEYEN NUMARA';

  document.getElementById('arayanAdi').textContent = arayanAdi || '';
  document.getElementById('tarih').textContent = aramaTarihi;

  // LOCALSTORAGE'A YAZ - ANA UYGULAMA BUNU DİNLEYECEK
  const callData = { arayan, arayanAdi, aranan, aramaTarihi, aramaId, senaryo, yon, timestamp: Date.now() };
  const storageKey = isGiden ? 'mr_netsipp_giden' : 'mr_netsipp_gelen';
  localStorage.setItem(storageKey, JSON.stringify(callData));

  // API'YE DE BİLDİR
  const endpoint = isGiden ? '/api/v1/netsipp/giden-cagri.php' : '/api/v1/netsipp/gelen-cagri.php';
  const apiParams = new URLSearchParams({arayan, arayanadi: arayanAdi, aramatarihi: aramaTarihi, aramaid: aramaId, senaryo, aranan});

  fetch(endpoint + '?' + apiParams.toString(), {
    headers: {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'}
  })
    .then(r => r.json())
    .then(data => {
      if (data?.data?.crm_kayit) {
        document.getElementById('arayanAdi').textContent =
          (data.data.crm_kayit.ad_soyad || arayanAdi) + ' (CRM KAYITLI)';
      }
    })
    .catch(() => {});

  // PENCEREYI OTOMATİK KAPAT (3 SANİYE SONRA)
  setTimeout(function() {
    try { window.close(); } catch(e) {}
    // window.close() çalışmazsa bilgi göster
    setTimeout(function() {
      var body = document.querySelector('.card');
      if (body) {
        var msg = document.createElement('div');
        msg.style.cssText = 'margin-top:16px;font-size:11px;color:#f59e0b;animation:blink 1s infinite';
        msg.textContent = 'BU SEKMEYİ KAPATABİLİRSİNİZ';
        body.appendChild(msg);
      }
    }, 500);
  }, 3000);
</script>
</body>
</html>
